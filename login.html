<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Cleaner - Inloggen</title>
    <style>
      :root {
        --bg-main: #0f1117;
        --bg-card: #161922;
        --accent-orange: #e5a00d;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --border-color: #262b3d;
      }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .login-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 32px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .header-brand {
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 24px;
        color: #fff;
      }
      .header-brand span { color: var(--accent-orange); }
      .form-group { margin-bottom: 18px; }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background-color: #0d0f14;
        color: var(--text-main);
        font-size: 0.95rem;
        box-sizing: border-box;
      }
      input[type="text"]:focus, input[type="password"]:focus {
        outline: none;
        border-color: var(--accent-orange);
      }
      .btn-submit {
        width: 100%;
        background-color: var(--accent-orange);
        color: #000;
        font-weight: 600;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 10px;
      }
      .flash-msg {
        background-color: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 0.85rem;
        text-align: center;
      }
    </style>
</head>
<body>
<div class="login-card">
  <div class="header-brand">plex <span>Cleaner</span></div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-msg">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form action="{{ url_for('login') }}" method="POST">
    <div class="form-group">
      <label for="username">Gebruikersnaam</label>
      <input type="text" id="username" name="username" required autofocus placeholder="admin">
    </div>
    <div class="form-group">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-submit">Inloggen</button>
  </form>
</div>
</body>
</html>
