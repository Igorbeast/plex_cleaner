<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Cleaner - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f111a;
            color: #e1e3ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #1a1d2d;
            border-radius: 12px;
            padding: 10px 20px;
        }
        .nav-link-custom {
            color: #a0a5ba;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: 5px;
        }
        .nav-link-custom.active, .nav-link-custom:hover {
            background-color: #2b2f48;
            color: #ffffff;
        }
        .card-custom {
            background-color: #181b29;
            border: 1px solid #262a40;
            border-radius: 16px;
            padding: 24px;
            height: 100%;
        }
        .btn-purple {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
        }
        .btn-purple:hover {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
            color: #fff;
        }
        .poster-img {
            width: 50px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
        }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid max-width-1400">
        <!-- Header -->
        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-broom fs-2 me-2 text-primary"></i>
            <h2 class="m-0 fw-bold">Plex Cleaner - Dashboard</h2>
        </div>

        <!-- Navigatie -->
        <div class="navbar-custom d-flex mb-4">
            <a href="/" class="nav-link-custom active"><i class="bi bi-grid-fill me-2"></i>Dashboard</a>
            <a href="/candidates" class="nav-link-custom"><i class="bi bi-file-earmark-text me-2"></i>Kandidaten</a>
            <a href="/history" class="nav-link-custom"><i class="bi bi-clock-history me-2"></i>Geschiedenis</a>
            <a href="/health" class="nav-link-custom"><i class="bi bi-shield-check me-2"></i>Health Status</a>
        </div>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
